{% extends base.html %}
{% block content %}
<div class="max-w-md mx-auto bg-white border border-darkBrown/10 p-8 rounded-xl shadow-sm">
    <h2 class="text-2xl font-serif font-bold text-darkBrown text-center mb-6">Create an Account</h2>
    
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-sageGreen text-warmCream font-medium py-2 rounded-md hover:bg-sageGreen/90 transition">
            Register
        </button>
    </form>

    <p class="text-center text-sm text-darkBrown/70 mt-6">
        Already have an account? <a href="{% url 'login' %}" class="text-terracotta font-semibold hover:underline">Log in</a>
    </p>
</div>
{%endblock %}
