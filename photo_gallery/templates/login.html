{% extends base.html %}
{% block content %}
<div class="max-w-md mx-auto bg-white border border-darkBrown/10 p-8 rounded-xl shadow-sm">
    <h2 class="text-2xl font-serif font-bold text-darkBrown text-center mb-6">Welcome Back</h2>
    
    <form method="post" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full bg-terracotta text-warmCream font-medium py-2 rounded-md hover:bg-terracotta/90 transition">
            Log In
        </button>
    </form>
    
    <p class="text-center text-sm text-darkBrown/70 mt-6">
        Don't have an account? <a href="{% url 'register' %}" class="text-sageGreen font-semibold hover:underline">Register here</a>
    </p>
</div>

{%endblock %}
