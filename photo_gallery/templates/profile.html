{% extends base.html %}
{% block content %}

<div class="max-w-2xl mx-auto bg-white border border-darkBrown/10 rounded-xl p-6 md:p-8 shadow-sm mb-10">
    <div class="flex flex-col md:flex-row items-center gap-6 mb-6">
        {% if user.profile.avatar %}
            <img src="{{ user.profile.avatar.url }}" alt="{{ user.username }}" class="w-24 h-24 rounded-full object-cover border-2 border-terracotta">
        {% else %}
            <div class="w-24 h-24 rounded-full bg-sageGreen text-warmCream flex items-center justify-center text-3xl font-bold font-serif">
                {{ user.username|slice:":1"|upper }}
            </div>
        {% endif %}
        <div class="text-center md:text-left">
            <h1 class="text-2xl font-serif font-bold text-darkBrown">{{ user.username }}</h1>
            <p class="text-sm text-darkBrown/60">{{ user.email }}</p>
            {% if user.profile.bio %}
                <p class="text-darkBrown/80 mt-2">{{ user.profile.bio }}</p>
            {% endif %}
        </div>
    </div>
</div>
